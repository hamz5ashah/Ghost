[package]
name = "ghost-mobile"
version = "1.0.0"
description = "Ghost for Android — a remote for Ghost running on your PC"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

# Android loads the app as a shared library.
[lib]
name = "ghost_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Smaller APK.
lto = true
opt-level = "s"
codegen-units = 1
strip = true
