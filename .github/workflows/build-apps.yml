name: Build apps

# Builds the Ghost desktop installer (Windows, optionally macOS/Linux) and the
# Ghost Android app, then publishes them as a GitHub Release in this repo.
#
# Run it from GitHub: Actions → "Build apps" → Run workflow.
# Pushing a tag like v1.2.0 also builds everything.
#
# Optional repository secrets for a stable Android signature (so new APKs
# install over old ones without uninstalling first):
#   ANDROID_KEYSTORE_BASE64   base64 of a .jks keystore
#   ANDROID_KEYSTORE_PASSWORD keystore (and key) password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
# Without them each build is signed with a fresh throwaway key.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'What to build'
        type: choice
        default: windows-and-android
        options:
          - windows-and-android
          - windows
          - android
          - all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Desktop builds have no update server; hide the in-app updater.
  VITE_GHOST_NO_UPDATER: '1'
  # Every build gets its own version, shown in Windows' app list, the
  # installer name and Settings > About.
  GHOST_VERSION: 1.1.${{ github.run_number }}
  VITE_GHOST_VERSION: 1.1.${{ github.run_number }}
  VITE_GHOST_BUILD: build-${{ github.run_number }}

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platforms != 'android'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      # Ghost's local model engine: Phantom (github.com/hamz5ashah/phantom),
      # with llama.cpp's Vulkan build beside it (uses the GPU when present,
      # otherwise the CPU). Phantom's own setup command picks the right files.
      - name: Download Phantom engine and llama.cpp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN=frontend/src-tauri/binaries
          mkdir -p "$BIN"
          gh release download -R hamz5ashah/phantom --pattern phantom-windows-amd64.exe --dir "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/phantom-windows-amd64.exe" "$BIN/phantom-x86_64-pc-windows-msvc.exe"
          PHANTOM_RUNTIME="$BIN/llama-runtime" "$BIN/phantom-x86_64-pc-windows-msvc.exe" setup --backend vulkan
          # Keep only the server and its libraries (the archive holds ~40 tools).
          find "$BIN/llama-runtime" -maxdepth 1 -type f -name '*.exe' ! -name 'llama-server.exe' -delete
          ls -la "$BIN/llama-runtime"

      # Pre-build Ghost's Rust extension so users don't need Rust or Visual
      # Studio Build Tools. The desktop app pins the backend to this Python.
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build ghost_rust wheel (Python 3.12)
        shell: bash
        run: |
          uv python install 3.12
          uvx --python 3.12 maturin build --release \
            --interpreter "$(uv python find 3.12)" \
            --manifest-path rust/crates/ghost-python/Cargo.toml --out wheels
          ls -la wheels

      # Ship uv so users don't have to install it by hand.
      - name: Stage uv.exe
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries/uv-bundle
          cp "$(command -v uv)" frontend/src-tauri/binaries/uv-bundle/uv.exe
          frontend/src-tauri/binaries/uv-bundle/uv.exe --version

      # Tesseract OCR for computer use (STONIC_PORT_PLAN.md, phase 2). Stonic's
      # installer claimed OCR but shipped only the pytesseract wrapper, so
      # text selection failed mid-task on every machine without Tesseract.
      # Ghost ships the engine itself: tesseract.exe, its DLLs and English
      # data only (no training tools, no other languages).
      - name: Stage Tesseract OCR
        shell: bash
        run: |
          set -euo pipefail
          choco install tesseract -y --no-progress
          SRC="/c/Program Files/Tesseract-OCR"
          [ -f "$SRC/tesseract.exe" ] || { echo "::error::Tesseract install not found at $SRC"; exit 1; }
          DEST=frontend/src-tauri/binaries/tesseract
          mkdir -p "$DEST/tessdata"
          cp "$SRC/tesseract.exe" "$DEST/"
          cp "$SRC"/*.dll "$DEST/"
          cp "$SRC/tessdata/eng.traineddata" "$DEST/tessdata/"
          du -sh "$DEST"

          # Prove the *staged* copy works on its own. PATH is cut to System32
          # so a DLL left behind cannot be borrowed from the choco install
          # folder (which choco puts on PATH) and hide a broken bundle.
          powershell.exe -NoProfile -Command '
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 900, 160
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::White)
            $font = New-Object System.Drawing.Font("Arial", 48)
            $g.DrawString("GHOST OCR WORKS", $font, [System.Drawing.Brushes]::Black, 20, 40)
            $bmp.Save("ocr-probe.png", [System.Drawing.Imaging.ImageFormat]::Png)
          '
          OUT=$(PATH="/c/Windows/System32:/c/Windows" TESSDATA_PREFIX="$(cygpath -w "$DEST/tessdata")" \
                "$DEST/tesseract.exe" ocr-probe.png stdout 2>/dev/null | tr -d '\r')
          echo "OCR read: $OUT"
          echo "$OUT" | grep -qi "GHOST OCR WORKS" || { echo "::error::Staged Tesseract could not read the probe image"; exit 1; }
          PATH="/c/Windows/System32:/c/Windows" "$DEST/tesseract.exe" --list-langs \
            --tessdata-dir "$(cygpath -w "$DEST/tessdata")" | grep -qx eng \
            || { echo "::error::Staged Tesseract has no eng data"; exit 1; }
          echo "Staged Tesseract runs on its own and reads English."

      # llama-server and its libraries must sit beside phantom.exe; uv.exe
      # goes beside Ghost so the app finds both.
      # The Stonic helpers (elevate.exe, swap-helper.exe) are Windows-only, so
      # they are mapped here rather than in tauri.conf.json — that file is
      # shared with the macOS/Linux jobs, where these binaries do not exist.
      # Landing them in "./" puts them beside the exe, which is exactly where
      # bundled_helper() in src/lib.rs looks.
      - name: Write build config
        shell: bash
        run: |
          cat > frontend/src-tauri/tauri.build.conf.json <<JSON
          {
            "version": "$GHOST_VERSION",
            "bundle": {
              "externalBin": ["binaries/phantom"],
              "createUpdaterArtifacts": false,
              "resources": {
                "../../wheels/": "backend/wheels/",
                "binaries/llama-runtime/": "./",
                "binaries/uv-bundle/uv.exe": "uv.exe",
                "resources/stonic/win32/": "./",
                "binaries/tesseract/": "tesseract/"
              }
            }
          }
          JSON

      - name: Build Windows installer
        working-directory: frontend
        run: npx tauri build --bundles nsis --config src-tauri/tauri.build.conf.json

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp frontend/src-tauri/target/release/bundle/nsis/*.exe out/
          ls -la out

      - name: Check installer contents
        shell: bash
        run: |
          7z l out/*.exe > contents.txt
          for f in ghost-desktop.exe phantom.exe llama-server.exe ggml-vulkan.dll uv.exe \
                   backend/pyproject.toml backend/wheels/ghost_rust- \
                   tesseract/tesseract.exe tesseract/tessdata/eng.traineddata; do
            if ! grep -qF "${f//\//\\}" contents.txt && ! grep -qF "$f" contents.txt; then
              echo "::error::Installer is missing $f"; exit 1
            fi
          done
          echo "Installer contains Ghost, Phantom + llama.cpp, uv and the backend."

      # Install the real installer and exercise what Ghost does on first
      # launch, from a folder whose name has spaces (like most user names).
      - name: Smoke test the installed app
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          INSTALLER=$(ls out/*.exe | head -1)
          # MSYS_NO_PATHCONV: Git Bash would otherwise rewrite "/S" into a
          # drive path, and the installer would wait for clicks forever.
          MSYS_NO_PATHCONV=1 timeout 600 "$INSTALLER" /S
          APP=""
          for d in "$(cygpath "$LOCALAPPDATA")/Ghost" "$(cygpath "$PROGRAMFILES")/Ghost"; do
            for i in $(seq 1 30); do [ -f "$d/ghost-desktop.exe" ] && break; sleep 2; done
            [ -f "$d/ghost-desktop.exe" ] && APP="$d" && break
          done
          [ -n "$APP" ] || { echo "::error::Ghost was not installed"; exit 1; }
          echo "Installed at: $APP"

          # The bundled engine, exactly as Ghost starts it: Phantom on the
          # Ollama port. Pull a small real model and chat with it (no GPU on
          # this runner, so llama.cpp falls back to the CPU).
          export PHANTOM_MODELS="$RUNNER_TEMP/phantom models"
          PHANTOM_HOST=127.0.0.1:11434 PHANTOM_DEBUG=1 "$APP/phantom.exe" serve > phantom.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/version || { cat phantom.log; echo "::error::Bundled Phantom did not start"; exit 1; }
          echo
          curl -sf http://127.0.0.1:11434/api/pull -d '{"model":"smollm2:135m","stream":false}' || { tail -50 phantom.log; echo "::error::Phantom could not pull a model"; exit 1; }
          echo
          REPLY=$(curl -sf --max-time 300 http://127.0.0.1:11434/api/chat \
            -d '{"model":"smollm2:135m","stream":false,"messages":[{"role":"user","content":"Say hello"}]}') \
            || { tail -80 phantom.log; echo "::error::Phantom could not run the model (llama-server)"; exit 1; }
          echo "Phantom replied: $REPLY" | head -c 400
          echo
          echo "$REPLY" | grep -q '"done":true' || { echo "::error::Unexpected chat reply"; exit 1; }

          # First-launch backend setup with the bundled uv and wheel, no Rust.
          WORK="$RUNNER_TEMP/Smoke User Name/Ghost"
          mkdir -p "$(dirname "$WORK")"
          cp -r "$APP/backend" "$WORK"
          cd "$WORK"
          export UV_PYTHON=3.12 PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi cargo | paste -sd:)"
          "$APP/uv.exe" sync --extra desktop --extra inference-cloud --extra inference-google \
            --group desktop-native --no-install-package ghost-rust
          "$APP/uv.exe" pip install --no-deps wheels/ghost_rust-*.whl
          "$APP/uv.exe" run python -c "import ghost_rust, ghost.server.app, kokoro_onnx, espeakng_loader; print('backend imports OK (incl. offline voice)')"

          # Start Ghost's server against a stand-in model and query it.
          python "$GITHUB_WORKSPACE/scripts/ci/mock_openai_server.py" 1234 > mock.log 2>&1 &
          export GHOST_HOME="$RUNNER_TEMP/ghost home"
          mkdir -p "$GHOST_HOME"
          printf '[engine]\ndefault = "lmstudio"\n' > "$GHOST_HOME/config.toml"
          # As the desktop shell does at spawn: point the backend at the
          # bundled OCR engine (lib.rs, bundled_tesseract).
          export GHOST_TESSERACT="$(cygpath -w "$APP/tesseract/tesseract.exe")"
          "$APP/uv.exe" run ghost serve --port 8765 --model mock-model > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/health || { cat serve.log; echo "::error::Ghost server did not start"; exit 1; }
          echo
          curl -sf http://127.0.0.1:8765/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"mock-model","messages":[{"role":"user","content":"hi"}]}' | head -c 300
          echo
          # The installed app's OCR, as computer use will see it.
          OCR=$(curl -sf http://127.0.0.1:8765/v1/computer/ocr/status)
          echo "OCR status: $OCR"
          echo "$OCR" | grep -q '"available": *true' || { echo "::error::Bundled OCR is not available"; exit 1; }
          echo "$OCR" | grep -q '"source": *"bundled"' || { echo "::error::OCR did not come from the bundled copy"; exit 1; }
          echo "Smoke test passed."

          # Stonic voice can be switched on from the app (Settings -> Assistant).
          curl -sf http://127.0.0.1:8765/v1/stonic/flags -H 'Content-Type: application/json' \
            -d '{"name":"realtime_voice","enabled":true}' | grep -q '"realtime_voice": *true' \
            || { echo "::error::Could not turn on the Stonic voice"; exit 1; }
          curl -sf http://127.0.0.1:8765/v1/stonic/flags | grep -q '"realtime_voice": *true' \
            || { echo "::error::Stonic voice flag did not stick"; exit 1; }
          echo "Stonic voice switch works."

          # Web search with no key falls back to DuckDuckGo (report only:
          # depends on the search site answering this runner).
          "$APP/uv.exe" run python -c "
          from ghost.tools.web_search import WebSearchTool
          r = WebSearchTool().execute(query='Lahore weather')
          print('web search ok:', bool(getattr(r, 'success', True)), str(getattr(r, 'content', r))[:200])
          " || echo "::warning::Keyless web search did not complete"

          # Identity with the user's model through the bundled Phantom, using
          # the same system prompt the app sends (report only: a 0.6B model).
          (cd "$GITHUB_WORKSPACE/frontend" && node --experimental-strip-types --no-warnings scripts/print-system-prompt.mts) \
            > "$RUNNER_TEMP/prompt.txt" || echo "::warning::Could not build the system prompt"
          echo "System prompt: $(wc -c < "$RUNNER_TEMP/prompt.txt") bytes"
          curl -s --max-time 900 http://127.0.0.1:11434/api/pull -d '{"model":"qwen3:0.6b","stream":false}' \
            || echo "::warning::Could not pull qwen3:0.6b"
          echo
          PROMPT_FILE="$RUNNER_TEMP/prompt.txt" python - <<'PY' || echo "::warning::Identity check did not complete"
          import json, os, urllib.request
          prompt = open(os.environ["PROMPT_FILE"], encoding="utf-8").read()
          body = {"model": "qwen3:0.6b", "stream": False, "think": False,
                  "messages": [{"role": "system", "content": prompt},
                               {"role": "user", "content": "Who developed you?"}]}
          req = urllib.request.Request("http://127.0.0.1:11434/api/chat", json.dumps(body).encode(), {"Content-Type": "application/json"})
          reply = json.loads(urllib.request.urlopen(req, timeout=600).read())["message"]["content"]
          print("Who developed you? ->", reply.strip()[:300])
          if "Syed Hamza Ali Shah" not in reply:
              print("::warning::The model did not name Syed Hamza Ali Shah")
          PY

          # Voice round trip (report only): offline Urdu voice -> Whisper.
          # UTF-8 so Urdu text can be printed on the Windows console.
          PYTHONIOENCODING=utf-8 python - <<'PY' || echo "::warning::Voice round-trip check did not complete"
          import json, time, urllib.request
          base = "http://127.0.0.1:8765/v1/speech"
          def call(path, data=None, ctype="application/json", timeout=600):
              req = urllib.request.Request(base + path, data=data, headers={"Content-Type": ctype} if data else {}, method="POST" if data is not None else "GET")
              return urllib.request.urlopen(req, timeout=timeout).read()
          call("/voices/kokoro_onnx/download", b"")
          call("/stt/prepare?model=small", b"")
          for _ in range(120):
              v = json.loads(call("/voices"))["kokoro_onnx"]["download"]["state"]
              s = json.loads(call("/stt/status?model=small"))["state"]
              if v in ("ready", "error") and s in ("ready", "error"):
                  break
              time.sleep(5)
          print("offline voice:", v, "| speech recognition:", s)
          text = "السلام علیکم۔ آج لاہور کا موسم بہت اچھا ہے۔"
          wav = call("/synthesize", json.dumps({"text": text, "backend": "kokoro_onnx", "voice_id": "hm_omega"}).encode())
          print("spoke", len(wav), "bytes of Urdu audio")
          boundary = "ghostboundary"
          body = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"language\"\r\n\r\nur\r\n"
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"model\"\r\n\r\nsmall\r\n"
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"a.wav\"\r\nContent-Type: audio/wav\r\n\r\n").encode() + wav + f"\r\n--{boundary}--\r\n".encode()
          heard = json.loads(call("/transcribe", body, f"multipart/form-data; boundary={boundary}"))
          print("said :", text)
          print("heard:", heard["text"])
          PY
          # Stop background servers so the step can finish.
          taskkill //F //IM phantom.exe //T > /dev/null 2>&1 || true
          taskkill //F //IM llama-server.exe //T > /dev/null 2>&1 || true
          taskkill //F //IM python.exe //T > /dev/null 2>&1 || true
          taskkill //F //IM uv.exe //T > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-windows
          path: out/*.exe
          if-no-files-found: error
          # The release keeps the files; build copies only need to live briefly.
          retention-days: 3

  macos:
    if: github.event_name == 'push' || inputs.platforms == 'all'
    timeout-minutes: 90
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      # Phantom engine (universal binary); it downloads llama.cpp on first use.
      - name: Download Phantom engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN=frontend/src-tauri/binaries
          mkdir -p "$BIN"
          gh release download -R hamz5ashah/phantom --pattern 'phantom-darwin-*' --dir "$RUNNER_TEMP"
          lipo -create "$RUNNER_TEMP/phantom-darwin-arm64" "$RUNNER_TEMP/phantom-darwin-amd64" -output "$BIN/phantom-universal-apple-darwin"
          chmod +x "$BIN/phantom-universal-apple-darwin"
          for arch in aarch64 x86_64; do
            cp "$BIN/phantom-universal-apple-darwin" "$BIN/phantom-${arch}-apple-darwin"
          done

      - name: Write build config
        run: |
          cat > frontend/src-tauri/tauri.build.conf.json <<JSON
          { "version": "$GHOST_VERSION", "bundle": { "externalBin": ["binaries/phantom"], "createUpdaterArtifacts": false } }
          JSON

      - name: Build macOS app (unsigned)
        working-directory: frontend
        run: npx tauri build --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.build.conf.json

      - name: Collect installer
        run: |
          mkdir -p out
          cp frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-macos
          path: out/*.dmg
          if-no-files-found: error
          # The release keeps the files; build copies only need to live briefly.
          retention-days: 3

  linux:
    if: github.event_name == 'push' || inputs.platforms == 'all'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      # Phantom engine; it downloads llama.cpp on first use.
      - name: Download Phantom engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN=frontend/src-tauri/binaries
          mkdir -p "$BIN"
          gh release download -R hamz5ashah/phantom --pattern phantom-linux-amd64 --dir "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/phantom-linux-amd64" "$BIN/phantom-x86_64-unknown-linux-gnu"

      - name: Write build config
        run: |
          cat > frontend/src-tauri/tauri.build.conf.json <<JSON
          { "version": "$GHOST_VERSION", "bundle": { "externalBin": ["binaries/phantom"], "createUpdaterArtifacts": false } }
          JSON

      - name: Build Linux packages
        working-directory: frontend
        run: npx tauri build --bundles deb,appimage --config src-tauri/tauri.build.conf.json

      - name: Collect packages
        run: |
          mkdir -p out
          cp frontend/src-tauri/target/release/bundle/deb/*.deb out/
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage out/

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-linux
          path: out/*
          if-no-files-found: error
          # The release keeps the files; build copies only need to live briefly.
          retention-days: 3

  android:
    if: github.event_name == 'push' || inputs.platforms != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix mobile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'mobile/src-tauri -> target'

      - name: Point Tauri at the Android NDK
        run: |
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK ${ANDROID_NDK_LATEST_HOME}"

      - name: Set app version
        run: |
          node -e "const f='mobile/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version=process.env.GHOST_VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          grep '"version"' mobile/src-tauri/tauri.conf.json

      - name: Generate Android project
        working-directory: mobile
        run: |
          npm run android:init
          npx tauri icon ../frontend/src-tauri/icons/icon.png

      - name: Build APK
        working-directory: mobile
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          UNSIGNED=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK was produced"; exit 1
          fi
          echo "Built: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ghost.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key. Uninstall the old app before installing this one."
            KS_PASS=$(openssl rand -hex 16)
            KEY_ALIAS=ghost
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ghost.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Ghost"
          fi
          export KS_PASS
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ghost.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out out/Ghost-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs out/Ghost-android.apk | head -3
          rm -f "$RUNNER_TEMP/ghost.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-android
          path: out/Ghost-android.apk
          if-no-files-found: error
          # The release keeps the files; build copies only need to live briefly.
          retention-days: 3

  release:
    needs: [windows, macos, linux, android]
    # Publish whatever built, even if an optional platform was skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ghost $GHOST_VERSION ($TAG)" \
            --notes "Windows: run the Ghost .exe installer. Android: open Ghost-android.apk on your phone (allow installing from this source). See docs/getting-started/desktop-and-android.md."
