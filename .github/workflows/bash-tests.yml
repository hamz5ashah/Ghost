name: Bash tests

# Manual only (Actions → this workflow → Run workflow) to save Actions minutes
# on this private repo. Restore push/pull_request triggers to run it automatically.
on:
  workflow_dispatch:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3-tomlkit

      - name: Run bats tests
        env:
          GHOST_TEST_PYTHON: /usr/bin/python3
        run: bats tests/install/bash/
